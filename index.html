<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 파비콘 (JINHYUN.AI JH 로고) -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  <title>등대의집 디지털도서관</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0f172a;
  }
  iframe {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif;
    color: #e2e8f0;
    background: #0f172a;
    text-align: center;
    padding: 24px;
  }
  #fallback a { color: #60a5fa; margin-top: 12px; font-size: 16px; }
</style>
</head>
<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxRxLezoq9A8yRaT4mLPFjLudOvrUPk6jnwSLfPkfBpjzjJylw17z9aH2JnH6zOpMWHxw/exec"
    title="등대의집 디지털도서관"
    allow="clipboard-write"
  ></iframe>
  <div id="fallback">
    <p>화면이 정상적으로 열리지 않으면 아래 링크를 통해 직접 접속해 주세요.</p>
    <a href="https://script.google.com/macros/s/AKfycbxRxLezoq9A8yRaT4mLPFjLudOvrUPk6jnwSLfPkfBpjzjJylw17z9aH2JnH6zOpMWHxw/exec" target="_top">직접 접속하기</a>
  </div>
  <script>
    setTimeout(function () {
      try {
        var frame = document.getElementById('appFrame');
        if (!frame.contentWindow) {
          document.getElementById('fallback').style.display = 'flex';
        }
      } catch (e) {
        document.getElementById('fallback').style.display = 'flex';
      }
    }, 6000);
  </script>
</body>
</html>
